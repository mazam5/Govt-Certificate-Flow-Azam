name: CertiFlow CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-and-test:
    name: Build, Typecheck & Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: certiflow
          POSTGRES_PASSWORD: certiflow_secret
          POSTGRES_DB: certiflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # Backend Verification
      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Generate Prisma Client & Push DB Schema
        env:
          DATABASE_URL: postgresql://certiflow:certiflow_secret@localhost:5432/certiflow?schema=public
          REDIS_URL: redis://localhost:6379
        run: |
          cd backend
          npx prisma generate
          npx prisma db push

      - name: Compile Backend TypeScript
        run: |
          cd backend
          npm run build

      - name: Run Vitest Integration Tests (6 Critical Moments)
        env:
          DATABASE_URL: postgresql://certiflow:certiflow_secret@localhost:5432/certiflow?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret-key-2026
        run: |
          cd backend
          npm run test

      # Frontend Verification
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Typecheck and Build Frontend Bundle (Vite)
        run: |
          cd frontend
          npm run build

  docker-build:
    name: Docker Containerization Build
    needs: validate-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build All Docker Images
        run: docker compose build
